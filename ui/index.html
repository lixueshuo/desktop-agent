<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desktop Agent</title>
<style>
:root{color-scheme:dark;--bg:#181818;--panel:#141414;--line:#2b2b2b;--text:#e7e7e7;--muted:#858585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px 'Segoe UI','Microsoft YaHei UI',sans-serif;overflow:hidden}button,textarea,input{font:inherit}button{cursor:pointer;border:0;transition:background .15s}header{height:62px;background:#181818;display:flex;align-items:center;gap:12px;padding:0 24px 0 20px;border-bottom:1px solid #242424}h1{font-size:15px;font-weight:600;margin:0;min-width:188px;letter-spacing:-.3px}h1:before{content:'⌘';font-size:22px;margin-right:10px;color:#d8d8d8}header #workspace{order:1;flex:1;font-size:11px;color:#747474;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header button{order:2;float:none!important;width:auto!important;padding:8px 12px;border:1px solid #353535;border-radius:7px;color:#b9b9b9;background:transparent;font-size:12px}header button:hover{background:#292929;color:white}main{display:grid;grid-template-columns:216px minmax(0,1fr);height:calc(100vh - 62px)}section{min-width:0;min-height:0}section:first-child{background:#111;border-right:1px solid #232323;padding:25px 12px;position:relative}section:first-child:after{content:'本地工作区';position:absolute;bottom:22px;left:24px;font-size:11px;color:#626262}section:first-child h2{font-size:11px;font-weight:500;color:#727272;margin:0 12px 16px;letter-spacing:1px}nav button{width:100%;text-align:left;padding:11px 13px;border-radius:7px;background:transparent;color:#a7a7a7;font-size:12px;overflow-wrap:anywhere}nav button:before{content:'›';color:#606060;margin-right:10px}nav button:hover{background:#202020;color:#eee}nav button.active{background:#292929;color:#fafafa}section:nth-child(2){display:none;background:#151515;border-right:1px solid #2a2a2a;flex-direction:column;overflow:hidden}.editor-open main{grid-template-columns:216px minmax(230px,.8fr) minmax(400px,1.2fr)}.editor-open section:nth-child(2){display:flex}#filename{font-size:12px;font-weight:500;padding:18px 22px;margin:0;border-bottom:1px solid #282828;color:#bdbdbd}#code{margin:0;padding:24px 20px;font:12px/1.9 Consolas,monospace;white-space:pre-wrap;overflow:auto;flex:1;color:#a5b4c3;tab-size:4}#remaining{font-size:11px;padding:0 20px;color:#717171}section:nth-child(3){background:#181818;display:flex;flex-direction:column;position:relative;padding:0 max(30px,calc((100% - 790px)/2)) 18px;gap:12px;overflow:hidden}.editor-open section:nth-child(3){padding:0 24px 18px}section:nth-child(3)>h2{font-size:12px;font-weight:500;color:#777;margin:0;padding:20px 0 0}section:nth-child(3)>p:not(#status){display:none}#events{order:1;flex:1;min-height:0;overflow:auto;padding:20px 0;scrollbar-width:thin;scrollbar-color:#383838 transparent}#events:empty{display:flex;flex-direction:column;justify-content:center;align-items:center;padding-bottom:85px}#events:empty:before{content:'今天想完成什么？';display:block;font-size:30px;font-weight:550;letter-spacing:-1px;color:#ededed;margin-bottom:14px}#events:empty:after{content:'从一个问题、一段代码，或一个想法开始。';font-size:13px;color:#747474}#events pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.85 Consolas,'Microsoft YaHei UI',monospace;margin:0 0 14px;padding:14px 18px;background:#202020;border:1px solid #303030;border-radius:9px;color:#999}#events pre.user{background:#303030;border:0;color:#e2e2e2;margin:0 0 28px 40px;font:14px/1.8 'Microsoft YaHei UI',sans-serif}#events pre.answer{background:transparent;border:0;padding:8px 0 24px;color:#d7d7d7;font:14px/1.95 'Microsoft YaHei UI',sans-serif}#events pre.error,.error{color:#e99b9b!important;border-color:#583333!important;background:#2b1f1f!important}textarea{order:2;width:100%;height:112px;min-height:90px;max-height:180px;resize:vertical;flex-shrink:0;background:#242424;border:1px solid #424242;border-radius:16px;padding:17px 19px 42px;color:#efefef;outline:none;box-shadow:0 8px 30px #0002}textarea:focus{border-color:#666}textarea::placeholder{color:#858585}#send{order:3;position:absolute;bottom:55px;right:max(43px,calc((100% - 764px)/2));width:32px;height:32px;border-radius:9px;background:#e7e7e7;color:#161616;font-size:0;display:grid;place-items:center}.editor-open #send{right:38px}#send:after{content:'↑';font-size:21px}#send:hover{background:#fff}#send:disabled{background:#444;color:#888;cursor:default}#stop{order:3;position:absolute;bottom:58px;left:max(48px,calc((100% - 754px)/2));background:transparent;color:#b6b6b6;font-size:11px}.editor-open #stop{left:42px}#stop:disabled{display:none}#status{order:4;min-height:15px;margin:0;font-size:10px;text-align:center;color:#646464;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}dialog{width:420px;border:1px solid #444;border-radius:16px;padding:28px;background:#202020;color:#ddd;box-shadow:0 25px 100px #0008}dialog::backdrop{background:#0009;backdrop-filter:blur(5px)}dialog h2{font-size:19px}dialog p{font-size:12px;color:#888}dialog input{display:block;width:100%;padding:12px;margin:14px 0;border:1px solid #444;background:#171717;border-radius:8px;color:#eee}dialog button{background:#363636;color:#ddd;padding:9px 20px;border-radius:7px;margin-right:8px}@media(max-width:1050px){main{grid-template-columns:180px 1fr}.editor-open main{grid-template-columns:160px minmax(190px,.65fr) minmax(340px,1fr)}h1{min-width:150px}#events:empty:before{font-size:25px}}

h1{display:flex;align-items:center;gap:10px}h1:before{display:none}.brand-mark{width:36px;height:36px;flex-shrink:0;filter:drop-shadow(0 0 12px #73a0ff15)}h1 small{display:block;font-size:8px;letter-spacing:1.6px;color:#767d8b;margin-top:3px}header{height:72px;background:#141519;border-bottom-color:#292c34}main{height:calc(100vh - 72px)}section:first-child{background:#101114}section:nth-child(3){background:radial-gradient(ellipse at 50% 25%,#20222a55,transparent 65%),#17181c}nav button.active{background:linear-gradient(90deg,#263743,#22242e);color:#b8e8ec;box-shadow:inset 2px 0 #6bd5cd}nav button:before{content:'◇';color:#737fa7}#events:empty:before{background:linear-gradient(105deg,#f1f3fa,#b8d2ea,#c2bbdf);background-clip:text;color:transparent}textarea:focus{border-color:#637e9e;box-shadow:0 0 0 3px #6399c510}#send{background:linear-gradient(135deg,#b5f1df,#b3caff);box-shadow:0 2px 12px #6dabff18}#send:hover{background:#d6e9ff}.editor-open section:nth-child(2){position:relative;background:#13151a}#filename{padding-right:82px;color:#a7c4d5}#save-file{position:absolute;top:10px;right:12px;background:#26343c;color:#a8e4dc;border:1px solid #3d5c60;border-radius:6px;font-size:11px;padding:7px 12px}#save-file:disabled{opacity:.4;cursor:default}.code-editor{display:flex;flex:1;min-height:0;overflow:hidden}#line-numbers{margin:0;width:46px;flex-shrink:0;padding:20px 10px 20px 0;text-align:right;background:#111318;color:#4e5768;font:13px/1.9 Consolas,monospace;overflow:hidden;user-select:none}textarea#code{order:0;width:100%;height:100%;min-height:0;max-height:none;flex:1;resize:none;margin:0;border:0;border-radius:0;padding:20px 16px;white-space:pre;overflow:auto;background:#14161c;box-shadow:none;color:#b8c9df;font:13px/1.9 Consolas,monospace;outline:none;tab-size:4}#remaining{min-height:18px;margin:0;padding:6px 16px;color:#687284;border-top:1px solid #252a33;font-size:10px}.command-control{order:2;display:flex;align-items:center;gap:7px;font-size:11px;color:#8a929f;align-self:flex-start}.command-control input{accent-color:#8dbad1}#task{order:3}#status{order:5}#events pre.user{background:#292d37;color:#dce3ef}#events pre.answer{color:#d8dfe8}header button{border-color:#31363f;color:#a5afbf}header button:hover{background:#252b35;color:#c6d9f0}
</style>
<header><h1><svg class="brand-mark" viewBox="0 0 40 40" aria-label="Desktop Agent 彩色标志"><defs><linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#40dfc4"/><stop offset=".5" stop-color="#69a6ff"/><stop offset="1" stop-color="#b682ff"/></linearGradient></defs><rect x="1" y="1" width="38" height="38" rx="12" fill="#222735" stroke="#3b4258"/><path d="M11 28 20 11 29 28M15 23h10" fill="none" stroke="url(#brand)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="10" r="3" fill="#74edce"/></svg><span>Desktop Agent<small>PERSONAL WORKSPACE</small></span></h1><button id="toggle-code">代码预览</button><button id="choose" style="width:auto;float:right">选择项目</button><button id="settings" style="width:auto;float:right">配置模型</button><div id="workspace">正在连接桌面窗口…</div></header>
<main><section><h2>项目文件</h2><nav id="files"></nav></section><section><h2 id="filename">选择文件查看内容</h2><button id="save-file" disabled>保存</button><div class="code-editor"><pre id="line-numbers">1</pre><textarea id="code" aria-label="代码编辑器" spellcheck="false" readonly placeholder="点击左侧文件开始编辑"></textarea></div><p id="remaining"></p></section><section><h2>新对话</h2><p>输入任务后，实际工具调用和修改差异会显示在下方。</p><label class="command-control"><input id="allow-commands" type="checkbox">允许执行项目命令</label><textarea id="task" placeholder="给 Desktop Agent 发送任务…"></textarea><button id="send" disabled>发送 ↑</button><button id="stop" disabled>中断</button><div id="events" aria-live="polite"></div><p id="status" role="status"></p></section></main>
<script>
const el=id=>document.getElementById(id);
let currentPath=null, revision=null, dirty=false, busy=false, polling=false;
function lineNumbers(){el('line-numbers').textContent=Array.from({length:el('code').value.split('\n').length},(_,i)=>i+1).join('\n');}
async function openFile(path){
 if(dirty&&!confirm('当前修改尚未保存，是否放弃并切换文件？'))return;
 const r=await window.pywebview.api.editor_read(path);document.body.classList.add('editor-open');
 if(r.error){el('remaining').textContent=r.error;return;}
 currentPath=path;revision=r.revision;dirty=false;el('filename').textContent=path;el('code').value=r.content;el('code').readOnly=busy;el('save-file').disabled=busy;lineNumbers();el('remaining').textContent='UTF-8 · 已保存';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.path===path));
}
async function refreshFiles(){
 const data=await window.pywebview.api.files();el('workspace').textContent=data.workspace;el('files').replaceChildren();
 for(const path of data.files){const b=document.createElement('button');b.textContent=path;b.dataset.path=path;b.onclick=()=>openFile(path).catch(()=>el('status').textContent='打开文件失败');el('files').appendChild(b);}
}
window.addEventListener('pywebviewready',async()=>{try{await refreshFiles();el('send').disabled=false;el('status').textContent='DeepSeek · 本地工作区';}catch(e){el('status').textContent='工作区加载失败';}});
el('code').oninput=()=>{dirty=true;lineNumbers();el('remaining').textContent='● 尚未保存';};
el('code').onscroll=()=>{el('line-numbers').scrollTop=el('code').scrollTop;};
el('save-file').onclick=async()=>{if(!currentPath)return;const r=await window.pywebview.api.save_file(currentPath,el('code').value,revision);if(r.error){el('remaining').textContent=r.error;return;}revision=r.revision;dirty=false;el('remaining').textContent='UTF-8 · 保存成功';};
el('code').onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();const t=e.target,start=t.selectionStart,end=t.selectionEnd;t.setRangeText('    ',start,end,'end');t.dispatchEvent(new Event('input'));}if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();el('save-file').click();}};
function record(text,error=false){const p=document.createElement('pre');p.textContent=text;if(error)p.className='error';else if(text.startsWith('你：'))p.className='user';else if(text.startsWith('助手回复：'))p.className='answer';el('events').appendChild(p);el('events').scrollTop=el('events').scrollHeight;}
function setBusy(value){busy=value;el('send').disabled=value;el('stop').disabled=!value;el('save-file').disabled=value||!currentPath;el('code').readOnly=value||!currentPath;el('choose').disabled=value;}
el('send').onclick=async()=>{if(dirty){record('请先保存代码，再发送任务。',true);return;}setBusy(true);try{const r=await window.pywebview.api.start_task(el('task').value,el('allow-commands').checked);if(r.error){record(r.error,true);setBusy(false);return;}record('你：'+el('task').value);el('status').textContent='正在处理…';}catch(e){record('任务启动失败',true);setBusy(false);}};
el('stop').onclick=async()=>{await window.pywebview.api.cancel_task();el('stop').disabled=true;el('status').textContent='已请求中断，网络请求可能等待超时';};
setInterval(async()=>{if(polling||!window.pywebview)return;polling=true;try{for(const e of await window.pywebview.api.poll_events()){
 if(e.type==='tool_start')record('调用 '+e.name+'：'+e.arguments);
 if(e.type==='tool_result'){const r=e.result;record(typeof r==='object'?(r.error||r.diff||r.text||JSON.stringify(r,null,2)):String(r),e.error);}
 if(e.type==='done')record('助手回复：'+e.text);
 if(['error','cancelled','trace_warning'].includes(e.type))record(e.text||'已中断',true);
 if(e.type==='finished'){setBusy(false);el('status').textContent='本次运行已结束';await refreshFiles();if(currentPath&&!dirty)await openFile(currentPath);}
 }}catch(e){el('status').textContent='连接异常，请重新打开窗口';}finally{polling=false;}},250);
el('settings').onclick=()=>{const dialog=document.createElement('dialog');dialog.innerHTML='<form><h2>配置 DeepSeek</h2><p>密钥仅保存在本机，请勿填写到聊天中。</p><input name="key" type="password" autocomplete="off" placeholder="API Key" required><input name="model" value="deepseek-flash" required><button>保存</button><button type="button" id="dismiss">取消</button></form>';document.body.appendChild(dialog);dialog.querySelector('#dismiss').onclick=()=>dialog.remove();dialog.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await window.pywebview.api.save_settings(f.get('key'),f.get('model'));if(r.error){alert(r.error);return;}dialog.remove();el('status').textContent='配置已保存';};dialog.showModal();};
el('choose').onclick=async()=>{if(dirty){el('status').textContent='请先保存当前修改';return;}const r=await window.pywebview.api.choose_workspace();if(r.error){el('status').textContent=r.error;return;}currentPath=null;revision=null;el('code').value='';el('code').readOnly=true;el('save-file').disabled=true;await refreshFiles();};
el('toggle-code').onclick=()=>document.body.classList.toggle('editor-open');
</script></html>
