<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desktop Agent</title>
<style>
:root{color-scheme:dark;--bg:#181818;--panel:#141414;--line:#2b2b2b;--text:#e7e7e7;--muted:#858585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px 'Segoe UI','Microsoft YaHei UI',sans-serif;overflow:hidden}button,textarea,input{font:inherit}button{cursor:pointer;border:0;transition:background .15s}header{height:62px;background:#181818;display:flex;align-items:center;gap:12px;padding:0 24px 0 20px;border-bottom:1px solid #242424}h1{font-size:15px;font-weight:600;margin:0;min-width:188px;letter-spacing:-.3px}h1:before{content:'⌘';font-size:22px;margin-right:10px;color:#d8d8d8}header #workspace{order:1;flex:1;font-size:11px;color:#747474;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header button{order:2;float:none!important;width:auto!important;padding:8px 12px;border:1px solid #353535;border-radius:7px;color:#b9b9b9;background:transparent;font-size:12px}header button:hover{background:#292929;color:white}main{display:grid;grid-template-columns:216px minmax(0,1fr);height:calc(100vh - 62px)}section{min-width:0;min-height:0}section:first-child{background:#111;border-right:1px solid #232323;padding:25px 12px;position:relative}section:first-child:after{content:'本地工作区';position:absolute;bottom:22px;left:24px;font-size:11px;color:#626262}section:first-child h2{font-size:11px;font-weight:500;color:#727272;margin:0 12px 16px;letter-spacing:1px}nav button{width:100%;text-align:left;padding:11px 13px;border-radius:7px;background:transparent;color:#a7a7a7;font-size:12px;overflow-wrap:anywhere}nav button:before{content:'›';color:#606060;margin-right:10px}nav button:hover{background:#202020;color:#eee}nav button.active{background:#292929;color:#fafafa}section:nth-child(2){display:none;background:#151515;border-right:1px solid #2a2a2a;flex-direction:column;overflow:hidden}.editor-open main{grid-template-columns:216px minmax(230px,.8fr) minmax(400px,1.2fr)}.editor-open section:nth-child(2){display:flex}#filename{font-size:12px;font-weight:500;padding:18px 22px;margin:0;border-bottom:1px solid #282828;color:#bdbdbd}#code{margin:0;padding:24px 20px;font:12px/1.9 Consolas,monospace;white-space:pre-wrap;overflow:auto;flex:1;color:#a5b4c3;tab-size:4}#remaining{font-size:11px;padding:0 20px;color:#717171}section:nth-child(3){background:#181818;display:flex;flex-direction:column;position:relative;padding:0 max(30px,calc((100% - 790px)/2)) 18px;gap:12px;overflow:hidden}.editor-open section:nth-child(3){padding:0 24px 18px}section:nth-child(3)>h2{font-size:12px;font-weight:500;color:#777;margin:0;padding:20px 0 0}section:nth-child(3)>p:not(#status){display:none}#events{order:1;flex:1;min-height:0;overflow:auto;padding:20px 0;scrollbar-width:thin;scrollbar-color:#383838 transparent}#events:empty{display:flex;flex-direction:column;justify-content:center;align-items:center;padding-bottom:85px}#events:empty:before{content:'今天想完成什么？';display:block;font-size:30px;font-weight:550;letter-spacing:-1px;color:#ededed;margin-bottom:14px}#events:empty:after{content:'从一个问题、一段代码，或一个想法开始。';font-size:13px;color:#747474}#events pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.85 Consolas,'Microsoft YaHei UI',monospace;margin:0 0 14px;padding:14px 18px;background:#202020;border:1px solid #303030;border-radius:9px;color:#999}#events pre.user{background:#303030;border:0;color:#e2e2e2;margin:0 0 28px 40px;font:14px/1.8 'Microsoft YaHei UI',sans-serif}#events pre.answer{background:transparent;border:0;padding:8px 0 24px;color:#d7d7d7;font:14px/1.95 'Microsoft YaHei UI',sans-serif}#events pre.error,.error{color:#e99b9b!important;border-color:#583333!important;background:#2b1f1f!important}textarea{order:2;width:100%;height:112px;min-height:90px;max-height:180px;resize:vertical;flex-shrink:0;background:#242424;border:1px solid #424242;border-radius:16px;padding:17px 19px 42px;color:#efefef;outline:none;box-shadow:0 8px 30px #0002}textarea:focus{border-color:#666}textarea::placeholder{color:#858585}#send{order:3;position:absolute;bottom:55px;right:max(43px,calc((100% - 764px)/2));width:32px;height:32px;border-radius:9px;background:#e7e7e7;color:#161616;font-size:0;display:grid;place-items:center}.editor-open #send{right:38px}#send:after{content:'↑';font-size:21px}#send:hover{background:#fff}#send:disabled{background:#444;color:#888;cursor:default}#stop{order:3;position:absolute;bottom:58px;left:max(48px,calc((100% - 754px)/2));background:transparent;color:#b6b6b6;font-size:11px}.editor-open #stop{left:42px}#stop:disabled{display:none}#status{order:4;min-height:15px;margin:0;font-size:10px;text-align:center;color:#646464;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}dialog{width:420px;border:1px solid #444;border-radius:16px;padding:28px;background:#202020;color:#ddd;box-shadow:0 25px 100px #0008}dialog::backdrop{background:#0009;backdrop-filter:blur(5px)}dialog h2{font-size:19px}dialog p{font-size:12px;color:#888}dialog input{display:block;width:100%;padding:12px;margin:14px 0;border:1px solid #444;background:#171717;border-radius:8px;color:#eee}dialog button{background:#363636;color:#ddd;padding:9px 20px;border-radius:7px;margin-right:8px}@media(max-width:1050px){main{grid-template-columns:180px 1fr}.editor-open main{grid-template-columns:160px minmax(190px,.65fr) minmax(340px,1fr)}h1{min-width:150px}#events:empty:before{font-size:25px}}
</style>
<header><h1>Desktop Agent</h1><button id="toggle-code">代码预览</button><button id="choose" style="width:auto;float:right">选择项目</button><button id="settings" style="width:auto;float:right">配置模型</button><div id="workspace">正在连接桌面窗口…</div></header>
<main><section><h2>项目文件</h2><nav id="files"></nav></section><section><h2 id="filename">选择文件查看内容</h2><pre id="code">左侧点击文件，查看带行号的代码。</pre><p id="remaining"></p></section><section><h2>新对话</h2><p>输入任务后，实际工具调用和修改差异会显示在下方。</p><textarea id="task" placeholder="给 Desktop Agent 发送任务…"></textarea><button id="send" disabled>发送 ↑</button><button id="stop" disabled>中断</button><div id="events" aria-live="polite"></div><p id="status" role="status"></p></section></main>
<script>
const el=id=>document.getElementById(id);
async function refreshFiles(){el('files').replaceChildren();
 try{
  el('send').disabled=false;
  const data=await window.pywebview.api.files();el('workspace').textContent=data.workspace;
  for(const path of data.files){const b=document.createElement('button');b.textContent=path;
   b.onclick=async()=>{try{const r=await window.pywebview.api.read(path);document.body.classList.add('editor-open');el('filename').textContent=path;el('code').textContent=r.error||r.text;el('code').className=r.error?'error':'';el('remaining').textContent=r.remaining_lines?`还有 ${r.remaining_lines} 行未展示`:'';document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');}catch(e){el('status').textContent='预览失败，请重试';}};
   el('files').appendChild(b);
  }el('status').textContent=`已列出 ${data.files.length} 个文件（最多300个）`;
 }catch(e){el('status').textContent='无法读取项目文件';}
}
window.addEventListener('pywebviewready',refreshFiles);

let polling=false;
function record(text,error=false){const p=document.createElement('pre');p.textContent=text;if(error)p.className='error';else if(text.startsWith('你：'))p.className='user';else if(text.startsWith('助手回复：'))p.className='answer';el('events').appendChild(p);p.scrollIntoView({block:'nearest'});}
el('send').onclick=async()=>{
 el('send').disabled=true;
 try{const r=await window.pywebview.api.start_task(el('task').value);if(r.error){record(r.error,true);el('send').disabled=false;return;}record('你：'+el('task').value);el('stop').disabled=false;el('status').textContent='运行中…';}
 catch(e){record('启动失败，请重试',true);el('send').disabled=false;}
};
el('stop').onclick=async()=>{await window.pywebview.api.cancel_task();el('stop').disabled=true;el('status').textContent='已请求中断；模型请求最多等待60秒，期间不再执行新工具';};
setInterval(async()=>{
 if(polling||!window.pywebview)return;polling=true;
 try{for(const e of await window.pywebview.api.poll_events()){
  if(e.type==='tool_start')record('调用 '+e.name+'：'+e.arguments);
  if(e.type==='tool_result'){const r=e.result;record(typeof r==='object'?(r.error||r.diff||r.text||JSON.stringify(r,null,2)):String(r),e.error);}
  if(e.type==='done')record('助手回复：'+e.text);
  if(e.type==='trace_warning')record(e.text,true);
  if(e.type==='error'||e.type==='cancelled')record(e.text||'已中断',true);
  if(e.type==='finished'){el('send').disabled=false;el('stop').disabled=true;el('status').textContent='本次运行已结束';}
 }}catch(e){el('status').textContent='事件连接失败，请重新打开窗口';}finally{polling=false;}
},200);

el('settings').onclick=()=>{const dialog=document.createElement('dialog');dialog.innerHTML='<form><h2>配置 DeepSeek</h2><p>密钥仅保存在本机，请勿填写到聊天中。</p><input name="key" type="password" autocomplete="off" placeholder="API Key" required><input name="model" value="deepseek-flash" required><button>保存</button><button type="button" id="dismiss">取消</button></form>';document.body.appendChild(dialog);dialog.querySelector('#dismiss').onclick=()=>dialog.remove();dialog.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await window.pywebview.api.save_settings(f.get('key'),f.get('model'));if(r.error){alert(r.error);return;}dialog.remove();el('status').textContent='配置已保存在本机';};dialog.showModal();};
el('choose').onclick=async()=>{const r=await window.pywebview.api.choose_workspace();if(r.error){el('status').textContent=r.error;return;}await refreshFiles();el('code').textContent='请选择文件';el('filename').textContent='选择文件查看内容';};
el('toggle-code').onclick=()=>document.body.classList.toggle('editor-open');
</script></html>
